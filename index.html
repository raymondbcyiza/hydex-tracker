<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hydex Tracker</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1020; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: #0b1020; color: #fff;
      z-index: 9999;
    }
    #loading small { display:block; opacity:.8; margin-top:.5rem; text-align:center }
    #bootError {
      max-width: 900px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.4;
      color: #ffd1d1;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,0,0,0.08);
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div style="text-align:center">
      Loading…
      <small id="bootStatus">Initializing…</small>
      <div id="bootError"></div>
    </div>
  </div>

  <div id="root"></div>

  <!-- Libraries (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.552.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>

  <script>
    (function () {
      const statusEl = document.getElementById('bootStatus');
      const errEl = document.getElementById('bootError');
      const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg; };
      const showError = (title, err) => {
        console.error(title, err);
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent =
            title + "\n\n" +
            (err && err.stack ? err.stack : String(err));
        }
        setStatus('Failed. See error below / Console.');
      };

      // Hard-fail early if libs didn't load
      setStatus('Checking libraries…');
      if (!window.React || !window.ReactDOM || !window.Babel || !window.lucide) {
        showError('Missing required global libraries.', {
          stack: JSON.stringify({
            React: !!window.React,
            ReactDOM: !!window.ReactDOM,
            Babel: !!window.Babel,
            lucide: !!window.lucide
          }, null, 2)
        });
        return;
      }

      // IMPORTANT: prevents Babel from auto-scanning <script type="text/babel">
      // (We don't use those, but this makes it deterministic.)
      if (typeof window.Babel.disableScriptTags === 'function') {
        window.Babel.disableScriptTags();
      }

      async function boot() {
        try {
          setStatus('Fetching app.jsx…');

          // Cache-bust so GitHub Pages doesn’t serve an old cached copy
          const res = await fetch('./app.jsx?v=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error(`Failed to fetch app.jsx (${res.status} ${res.statusText})`);
          const source = await res.text();

          setStatus('Compiling JSX…');

          // Compile JSX -> JS (NO transformScriptTags; no require/exports)
          const out = window.Babel.transform(source, {
            presets: [
              ['env', { modules: false, targets: { esmodules: true } }],
              ['react', { runtime: 'classic' }]
            ]
          });

          setStatus('Running app…');

          // Append a mount call at the end so the app definitely renders.
          // This assumes your app defines `HydexTracker` in the global scope.
          const mountCode = `
            ;(function(){
              try {
                const rootEl = document.getElementById('root');
                if (!rootEl) throw new Error('Missing #root element');

                if (typeof HydexTracker !== 'function') {
                  throw new Error('HydexTracker is not defined. Make sure app.jsx defines: const HydexTracker = () => { ... }');
                }

                const root = ReactDOM.createRoot(rootEl);
                root.render(React.createElement(HydexTracker));

                const loading = document.getElementById('loading');
                if (loading) loading.remove();
              } catch (e) {
                console.error('Mount failed:', e);
                const loading = document.getElementById('loading');
                if (loading) {
                  const st = document.getElementById('bootStatus');
                  if (st) st.textContent = 'Mount failed. See Console.';
                }
              }
            })();
          `;

          const s = document.createElement('script');
          s.type = 'text/javascript';
          // helpful in DevTools stack traces
          s.text = out.code + "\n//# sourceURL=app.compiled.js\n" + mountCode;
          document.body.appendChild(s);

          // If something *still* leaves the loader up, give a hint.
          setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) {
              setStatus('Still loading… check Console for a runtime error.');
            }
          }, 3000);

        } catch (e) {
          showError('Boot failed (fetch/compile/run).', e);
        }
      }

      boot();
    })();
  </script>
</body>
</html>
